# Houston for tmux — ported from withastro/houston-vscode
# Source this after the APPEARANCE block in tmux.conf:
#   source-file ~/dotfiles/tmux/themes/houston.conf
#
# The session badge uses statusBar.background (#17548b), Houston's own status
# bar blue, so the bar reads as the same object it is in the editor.

set -g status-style 'bg=#23262d fg=#858b98'

set -g status-left  '#[bg=#17548b,fg=#eef0f9,bold] #S #[bg=#23262d,fg=#343841] '
set -g status-right '#[fg=#343841]│#[fg=#bfc1c9] %H:%M #[fg=#343841]│#[fg=#bfc1c9] %d-%b-%y '

setw -g window-status-format         '#[fg=#545864] #I:#W '
setw -g window-status-current-format '#[fg=#00daef,bold] #I:#W '

set -g pane-border-style        'fg=#343841'
set -g pane-active-border-style 'fg=#00daef'

set -g message-style 'bg=#17548b fg=#eef0f9 bold'
set -g mode-style    'bg=#2d4860 fg=#eef0f9'
